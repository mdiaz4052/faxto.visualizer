name: Phase 0 contracts
on:
  push:
    branches: [main, phase-0-foundation]
  pull_request:
permissions:
  contents: read
jobs:
  python:
    strategy:
      matrix:
        python-version: ["3.12.14", "3.13.15"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r analyzer/requirements-lock.txt
      - run: python -m unittest discover -s analyzer/tests -v
      - run: python -m compileall -q analyzer/src analyzer/tests tools
      - run: git diff --check
  godot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - name: Download and verify official Godot
        run: python tools/download_godot.py /tmp/faxto-godot
      - name: Import and parse project
        run: python tools/check_godot.py /tmp/faxto-godot/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path godot --import
      - name: Instantiate application shell
        run: python tools/check_godot.py /tmp/faxto-godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --quit-after 3
      - name: Run deterministic and standalone contracts
        run: |
          python tools/check_godot.py /tmp/faxto-godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/test_contracts.gd
          python tools/check_godot.py /tmp/faxto-godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/test_standalone.gd
      - name: Render fixed viewport and short PNG sequence
        run: xvfb-run -a python tools/check_godot.py /tmp/faxto-godot/Godot_v4.7.2-stable_linux.x86_64 --audio-driver Dummy --path godot --script res://tests/test_render_export.gd
