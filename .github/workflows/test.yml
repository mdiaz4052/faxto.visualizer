name: Phase 0 contracts

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r analyzer/requirements-lock.txt
      - run: PYTHONPATH=analyzer/src python -m unittest discover -s analyzer/tests -v
      - run: python -m compileall -q analyzer/src analyzer/tests

  godot:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.7.2"
    steps:
      - uses: actions/checkout@v4
      - name: Download official Godot build
        run: |
          curl --fail --location --retry 3 \
            --output /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /tmp/godot/godot
          chmod +x /tmp/godot/godot
          /tmp/godot/godot --version
      - name: Import and parse project
        run: |
          set -o pipefail
          /tmp/godot/godot --headless --editor --path godot --quit-after 2 2>&1 | tee /tmp/godot-import.log
          ! grep -E "SCRIPT ERROR|Parse Error|Failed to load" /tmp/godot-import.log
      - name: Instantiate application shell
        run: |
          set -o pipefail
          /tmp/godot/godot --headless --path godot --quit-after 2 2>&1 | tee /tmp/godot-app.log
          ! grep -E "SCRIPT ERROR|Parse Error|Failed to load" /tmp/godot-app.log
      - name: Run deterministic Godot contracts
        run: |
          set -o pipefail
          /tmp/godot/godot --headless --path godot --script res://tests/test_contracts.gd 2>&1 | tee /tmp/godot-contracts.log
          ! grep -E "SCRIPT ERROR|Parse Error|Failed to load" /tmp/godot-contracts.log
