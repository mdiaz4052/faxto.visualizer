name: Phase 0 contracts

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r analyzer/requirements-lock.txt
      - run: PYTHONPATH=analyzer/src python -m unittest discover -s analyzer/tests -v
      - run: python -m compileall -q analyzer/src analyzer/tests
